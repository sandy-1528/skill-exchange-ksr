<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap | Student Exchange Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- TOP NAV -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-graduation-cap text-2xl text-amber-300"></i>
        <span class="text-xl font-bold tracking-tight">SkillSwap</span>
      </div>

      <!-- Active User Switcher for Hackathon Demo -->
      <div class="flex items-center gap-3 bg-indigo-700/60 px-3 py-1.5 rounded-lg border border-indigo-500">
        <label for="userSelect" class="text-xs uppercase font-semibold text-indigo-200">Acting As:</label>
        <select id="userSelect" onchange="handleUserChange()" class="bg-indigo-800 text-white text-sm rounded px-2 py-1 outline-none border border-indigo-400 cursor-pointer">
          <!-- Populated dynamically -->
        </select>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- DASHBOARD TABS -->
    <div class="flex flex-wrap gap-2 border-b border-slate-200 mb-6 pb-2">
      <button onclick="switchTab('matches')" id="tab-matches" class="tab-btn px-4 py-2 font-medium rounded-lg bg-indigo-600 text-white flex items-center gap-2">
        <i class="fa-solid fa-bolt text-amber-300"></i> Smart Matches
      </button>
      <button onclick="switchTab('browse')" id="tab-browse" class="tab-btn px-4 py-2 font-medium rounded-lg text-slate-600 hover:bg-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-magnifying-glass"></i> Browse All Peers
      </button>
      <button onclick="switchTab('requests')" id="tab-requests" class="tab-btn px-4 py-2 font-medium rounded-lg text-slate-600 hover:bg-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-handshake"></i> Swaps & Requests (<span id="reqCount">0</span>)
      </button>
    </div>

    <!-- TAB 1: SMART MATCHES -->
    <section id="view-matches">
      <div class="bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-100 rounded-xl p-5 mb-6">
        <h2 class="text-lg font-bold text-indigo-900">Intelligent Matchmaking</h2>
        <p class="text-sm text-indigo-700">Calculated based on your wanted skills and what your fellow students can offer in return.</p>
      </div>

      <div id="matchesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered with JS -->
      </div>
    </section>

    <!-- TAB 2: BROWSE ALL & SEARCH -->
    <section id="view-browse" class="hidden">
      <div class="mb-6 flex gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-400"></i>
          <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search by skill name (e.g. Python, UI Design, Guitar)..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>
      <div id="browseGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- TAB 3: REQUESTS -->
    <section id="view-requests" class="hidden">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 bg-slate-50">
          <h3 class="font-bold text-slate-800">Your Swap Exchanges</h3>
        </div>
        <div id="requestsList" class="divide-y divide-slate-100"></div>
      </div>
    </section>
  </main>

  <!-- MODAL: SEND SWAP PROPOSAL -->
  <div id="swapModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-800 mb-1">Request Skill Exchange</h3>
      <p class="text-xs text-slate-500 mb-4" id="modalTargetInfo"></p>
      
      <form id="swapForm" onsubmit="submitSwapRequest(event)" class="space-y-4">
        <input type="hidden" id="modalTargetId">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">I will teach them:</label>
          <input type="text" id="modalSkillOffered" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g. Python basics">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">In exchange for learning:</label>
          <input type="text" id="modalSkillRequested" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g. Figma prototyping">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('swapModal')" class="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-100">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Send Request</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD RATING -->
  <div id="reviewModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-800 mb-2">Rate Exchange Session</h3>
      <form id="reviewForm" onsubmit="submitReview(event)" class="space-y-4">
        <input type="hidden" id="reviewTargetId">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Rating (1 to 5 Stars):</label>
          <select id="reviewRating" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
            <option value="5">⭐⭐⭐⭐⭐ (5 - Exceptional)</option>
            <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
            <option value="3">⭐⭐⭐ (3 - Average)</option>
            <option value="2">⭐⭐ (2 - Needs Improvement)</option>
            <option value="1">⭐ (1 - Poor)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Feedback / Comment:</label>
          <textarea id="reviewComment" rows="3" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="How did the skill sharing go?"></textarea>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal('reviewModal')" class="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-100">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700">Submit Review</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let users = [];
    let currentUserId = 1;

    async function init() {
      await fetchUsers();
      loadMatches();
      loadRequests();
    }

    async function fetchUsers() {
      const res = await fetch('/api/users');
      users = await res.json();
      
      const select = document.getElementById('userSelect');
      select.innerHTML = users.map(u => 
        `<option value="${u.id}" ${u.id == currentUserId ? 'selected' : ''}>${u.name} (ID: ${u.id})</option>`
      ).join('');
    }

    function handleUserChange() {
      currentUserId = document.getElementById('userSelect').value;
      loadMatches();
      loadRequests();
    }

    function switchTab(tab) {
      ['matches', 'browse', 'requests'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'tab-btn px-4 py-2 font-medium rounded-lg text-slate-600 hover:bg-slate-200 flex items-center gap-2';
      });

      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'tab-btn px-4 py-2 font-medium rounded-lg bg-indigo-600 text-white flex items-center gap-2';

      if (tab === 'browse') loadBrowse();
    }

    async function loadMatches() {
      const res = await fetch(`/api/match/${currentUserId}`);
      const data = await res.json();
      const container = document.getElementById('matchesGrid');
      
      if (!data.length) {
        container.innerHTML = `<p class="text-slate-400 col-span-3 text-center py-8">No peers found to match with.</p>`;
        return;
      }

      container.innerHTML = data.map(peer => `
        <div class="bg-white rounded-xl shadow-sm border ${peer.matchScore >= 100 ? 'border-amber-400 ring-2 ring-amber-300/40' : 'border-slate-200'} p-5 flex flex-col justify-between">
          <div>
            <div class="flex items-start justify-between mb-3">
              <div class="flex items-center gap-3">
                <img src="${peer.avatar}" class="w-12 h-12 rounded-full object-cover border" alt="${peer.name}">
                <div>
                  <h4 class="font-bold text-slate-900">${peer.name}</h4>
                  <div class="text-xs text-amber-500 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-star"></i> ${peer.avg_rating || '5.0'} (${peer.review_count || 0} reviews)
                  </div>
                </div>
              </div>
              ${peer.matchScore >= 100 
                ? `<span class="bg-amber-100 text-amber-800 text-[11px] font-bold px-2 py-0.5 rounded-full border border-amber-300">⭐ Mutual Match</span>` 
                : `<span class="bg-slate-100 text-slate-600 text-[11px] font-semibold px-2 py-0.5 rounded-full">${peer.matchScore}% Match</span>`}
            </div>

            <p class="text-xs text-slate-500 mb-4 line-clamp-2">${peer.bio}</p>

            <div class="space-y-2 mb-4">
              <div>
                <span class="text-[11px] font-bold uppercase text-emerald-700 tracking-wider">Teaches:</span>
                <div class="flex flex-wrap gap-1 mt-1">
                  ${peer.skills_offered.split(',').map(s => `<span class="bg-emerald-50 text-emerald-700 text-xs px-2 py-0.5 rounded border border-emerald-200">${s.trim()}</span>`).join('')}
                </div>
              </div>

              <div>
                <span class="text-[11px] font-bold uppercase text-indigo-700 tracking-wider">Wants to Learn:</span>
                <div class="flex flex-wrap gap-1 mt-1">
                  ${peer.skills_wanted.split(',').map(s => `<span class="bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded border border-indigo-200">${s.trim()}</span>`).join('')}
                </div>
              </div>
            </div>
          </div>

          <div class="flex gap-2 pt-3 border-t border-slate-100">
            <button onclick="openSwapModal(${peer.id}, '${peer.name}')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2 rounded-lg transition">Request Swap</button>
            <button onclick="openReviewModal(${peer.id})" class="px-3 border border-slate-300 hover:bg-slate-50 text-slate-600 text-xs font-semibold rounded-lg"><i class="fa-regular fa-star"></i></button>
          </div>
        </div>
      `).join('');
    }

    async function loadBrowse() {
      const search = document.getElementById('searchInput').value;
      const res = await fetch(`/api/users?search=${encodeURIComponent(search)}`);
      const data = await res.json();
      const container = document.getElementById('browseGrid');

      const peers = data.filter(u => u.id != currentUserId);

      container.innerHTML = peers.map(peer => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between">
          <div>
            <div class="flex items-center gap-3 mb-3">
              <img src="${peer.avatar}" class="w-12 h-12 rounded-full object-cover border" alt="${peer.name}">
              <div>
                <h4 class="font-bold text-slate-900">${peer.name}</h4>
                <div class="text-xs text-amber-500 font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-star"></i> ${peer.avg_rating || '5.0'} (${peer.review_count || 0})
                </div>
              </div>
            </div>
            <p class="text-xs text-slate-500 mb-4">${peer.bio}</p>
            <div class="space-y-2 mb-4 text-xs">
              <p><strong class="text-emerald-700">Teaches:</strong> ${peer.skills_offered}</p>
              <p><strong class="text-indigo-700">Wants:</strong> ${peer.skills_wanted}</p>
            </div>
          </div>
          <button onclick="openSwapModal(${peer.id}, '${peer.name}')" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2 rounded-lg transition">Request Swap</button>
        </div>
      `).join('');
    }

    function handleSearch() {
      loadBrowse();
    }

    async function loadRequests() {
      const res = await fetch(`/api/requests/${currentUserId}`);
      const requests = await res.json();
      
      document.getElementById('reqCount').innerText = requests.length;
      const list = document.getElementById('requestsList');

      if (!requests.length) {
        list.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">No swap requests found. Initiate one from the matches tab!</div>`;
        return;
      }

      list.innerHTML = requests.map(r => {
        const isIncoming = r.receiver_id == currentUserId;
        const otherParty = isIncoming ? r.sender_name : r.receiver_name;
        const badgeColor = r.status === 'accepted' ? 'bg-emerald-100 text-emerald-800' : r.status === 'rejected' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800';

        return `
          <div class="p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="text-xs font-bold uppercase tracking-wider ${isIncoming ? 'text-indigo-600' : 'text-slate-500'}">
                  ${isIncoming ? 'Incoming Request from' : 'Sent to'} ${otherParty}
                </span>
                <span class="text-[11px] px-2 py-0.5 rounded-full font-bold uppercase ${badgeColor}">${r.status}</span>
              </div>
              <p class="text-sm text-slate-700">
                Offering: <span class="font-semibold text-emerald-700">${r.skill_offered}</span> ➔ Receiving: <span class="font-semibold text-indigo-700">${r.skill_requested}</span>
              </p>
              <span class="text-[11px] text-slate-400">${new Date(r.created_at).toLocaleString()}</span>
            </div>

            ${isIncoming && r.status === 'pending' ? `
              <div class="flex items-center gap-2">
                <button onclick="updateStatus(${r.id}, 'accepted')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold">Accept</button>
                <button onclick="updateStatus(${r.id}, 'rejected')" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded text-xs font-semibold">Reject</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function updateStatus(id, status) {
      await fetch(`/api/requests/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadRequests();
    }

    function openSwapModal(peerId, peerName) {
      document.getElementById('modalTargetId').value = peerId;
      document.getElementById('modalTargetInfo').innerText = `Propose an exchange with ${peerName}`;
      document.getElementById('swapModal').classList.remove('hidden');
    }

    async function submitSwapRequest(e) {
      e.preventDefault();
      const payload = {
        sender_id: currentUserId,
        receiver_id: document.getElementById('modalTargetId').value,
        skill_offered: document.getElementById('modalSkillOffered').value,
        skill_requested: document.getElementById('modalSkillRequested').value,
      };

      await fetch('/api/requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      closeModal('swapModal');
      document.getElementById('swapForm').reset();
      switchTab('requests');
      loadRequests();
    }

    function openReviewModal(targetId) {
      document.getElementById('reviewTargetId').value = targetId;
      document.getElementById('reviewModal').classList.remove('hidden');
    }

    async function submitReview(e) {
      e.preventDefault();
      const payload = {
        reviewer_id: currentUserId,
        target_id: document.getElementById('reviewTargetId').value,
        rating: document.getElementById('reviewRating').value,
        comment: document.getElementById('reviewComment').value
      };

      await fetch('/api/reviews', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      closeModal('reviewModal');
      document.getElementById('reviewForm').reset();
      loadMatches();
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    init();
  </script>
</body>
</html>
